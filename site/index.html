  <script src="assets/js/theme.js"></script>
  <script>
    // Cover the page before first paint when the intro is going to play, so the
    // page doesn't flash before the intro module loads. Must match shouldAnimate()
    // in assets/js/session.js (same storage key): ?intro, or not seen yet this session.
    (function () {
      var seen = false;
      try { seen = sessionStorage.getItem('rollout-intro:seen') === '1'; } catch (e) {}
      if (/[?&]intro\b/.test(location.search) || !seen) {
        document.documentElement.classList.add('intro-pending');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script type="module" src="assets/js/main.js"></script>
</head>
